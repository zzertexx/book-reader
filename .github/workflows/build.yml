name: Build APK

on:
  push:
    branches: [ "claude/pdf-reader-cross-device-FVLBg", "main" ]
  workflow_dispatch:   # lets you trigger a build manually from the browser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Inject Firebase Web Client ID
        run: |
          sed -i "s|YOUR_WEB_CLIENT_ID_HERE|${{ secrets.FIREBASE_WEB_CLIENT_ID }}|g" \
            app/src/main/res/values/strings.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=8.2 --distribution-type=bin

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BookReader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
